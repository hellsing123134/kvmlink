[package]
name = "kvmlink"
version = "0.2.0"
edition = "2021"
description = "Share one keyboard and mouse between two Windows PCs over the LAN"
license = "MIT"
readme = "README.md"
keywords = ["kvm", "keyboard", "mouse", "windows", "sharing"]

[dependencies]
chacha20poly1305 = "0.10"
sha2 = "0.10"
getrandom = "0.2"
spake2 = "0.4"

[build-dependencies]
embed-resource = "3"

[dependencies.windows-sys]
version = "0.59"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_Media",
  "Win32_Security",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_RemoteDesktop",
  "Win32_System_StationsAndDesktops",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
